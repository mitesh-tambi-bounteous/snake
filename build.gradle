plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.snake.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.snake.Main'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation gradleTestKit()
}

test {
    useJUnitPlatform()
}
